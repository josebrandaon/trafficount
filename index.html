<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TraffiCount</title>
<meta name="description" content="Contagem manual classificada de tráfego rodoviário, com localização GPS e exportação CSV/SHP.">
<meta name="theme-color" content="#17594A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TraffiCount">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="vendor/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  /* TraffiCount — sistema visual.
     Fundo neutro frio, superfícies brancas com contorno subtil, cor reservada aos sentidos e às classes.
     Inter (variável, incluída na aplicação) com algarismos tabulares em todos os contadores. */
  @font-face{ font-family:"Inter"; font-style:normal; font-weight:100 900; font-display:swap;
    src:url("vendor/inter/inter-latin-wght-normal.woff2") format("woff2"); }
  :root{
    --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF2F6; --field:#F8FAFC;
    --ink:#17212F; --ink-soft:#64748B; --ink-faint:#94A3B8; --icon:#5B6778;
    --border:#E2E8F0; --border-strong:#CBD5E1;
    --primary:#17594A; --primary-ink:#FFFFFF; --primary-soft:#E3F1EC;
    --s1:#2463A6; --s2:#C65B1B; --s1-bg:#2463A6; --s2-bg:#C65B1B; --on-dir:#FFFFFF;
    --danger:#C0392B; --danger-soft:#FBEDEB; --warn:#A16207; --ok:#15803D;
    --c-nm:#4D7C0F; --c-mc:#B7791F; --c-lp:#2463A6; --c-lm:#0D9488; --c-lx:#0E7490; --c-pp:#8050B5; --c-pm:#C83E2D; --c-px:#9D174D;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
    --shadow-lift:0 4px 14px rgba(15,23,42,.08);
    --focus:#2463A6;
    --r-sm:10px; --r:14px; --r-lg:16px;
    --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E141B; --surface:#161E28; --surface-2:#1E2834; --field:#121A23;
      --ink:#E6EDF5; --ink-soft:#94A3B8; --ink-faint:#64748B; --icon:#A3B0C2;
      --border:#253141; --border-strong:#334155;
      --primary:#3FBF99; --primary-ink:#06231B; --primary-soft:#14332B;
      --s1:#4F8FD6; --s2:#E07B3C; --s1-bg:#2B67AD; --s2-bg:#B4561F; --on-dir:#FFFFFF;
      --danger:#F07462; --danger-soft:#3A1E1B; --warn:#EAB308; --ok:#4ADE80;
      --c-nm:#8CC63F; --c-mc:#E0A84A; --c-lp:#6EA6E6; --c-lm:#2DC2B3; --c-lx:#38BDF8; --c-pp:#AE8BE0; --c-pm:#F0806E; --c-px:#F472B6;
      --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lift:0 6px 18px rgba(0,0,0,.4);
      --focus:#6EA6E6; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E141B; --surface:#161E28; --surface-2:#1E2834; --field:#121A23;
    --ink:#E6EDF5; --ink-soft:#94A3B8; --ink-faint:#64748B; --icon:#A3B0C2;
    --border:#253141; --border-strong:#334155;
    --primary:#3FBF99; --primary-ink:#06231B; --primary-soft:#14332B;
    --s1:#4F8FD6; --s2:#E07B3C; --s1-bg:#2B67AD; --s2-bg:#B4561F; --on-dir:#FFFFFF;
    --danger:#F07462; --danger-soft:#3A1E1B; --warn:#EAB308; --ok:#4ADE80;
    --c-nm:#8CC63F; --c-mc:#E0A84A; --c-lp:#6EA6E6; --c-lm:#2DC2B3; --c-lx:#38BDF8; --c-pp:#AE8BE0; --c-pm:#F0806E; --c-px:#F472B6;
    --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lift:0 6px 18px rgba(0,0,0,.4);
    --focus:#6EA6E6; color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.4;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; text-rendering:optimizeLegibility;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .num{ font-family:var(--font); font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1, "cv11" 1; }
  #app{ max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
  .screen{ flex:1; display:flex; flex-direction:column; gap:12px; padding-block:12px 16px; }
  svg.i{ width:18px; height:18px; flex:none; }

  /* cabeçalhos */
  .bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; }
  .bar.start{ justify-content:flex-start; }
  .bar h1{ font-size:20px; margin:0; font-weight:700; letter-spacing:-.015em; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ border-radius:8px; box-shadow:var(--shadow); }
  .when{ font-size:13px; font-weight:500; color:var(--ink-soft); background:var(--surface); border:1px solid var(--border);
    border-radius:99px; padding:5px 10px; box-shadow:var(--shadow); white-space:nowrap; }

  /* botões */
  .btn{ appearance:none; border:1px solid var(--border); background:var(--surface); color:var(--ink);
    border-radius:12px; min-height:48px; padding:0 16px; font-family:var(--font); font-size:15px; font-weight:600; letter-spacing:-.005em;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; box-shadow:var(--shadow);
    transition:background-color .12s, border-color .12s, transform .06s; }
  .btn:active{ transform:scale(.98); }
  .btn:focus-visible, input:focus-visible, .vbtn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .btn-accent{ background:var(--primary); color:var(--primary-ink); border-color:transparent; }
  .btn-soft{ background:var(--primary-soft); color:var(--primary); border-color:transparent; box-shadow:none; }
  .btn-danger{ color:var(--danger); background:var(--danger-soft); border-color:transparent; box-shadow:none; }
  .btn-ghost{ background:transparent; border-color:transparent; box-shadow:none; color:var(--ink-soft); }
  .btn-sm{ min-height:36px; padding:0 12px; font-size:13.5px; border-radius:10px; }
  .btn-lg{ min-height:56px; font-size:16.5px; border-radius:14px; }
  .btn-block{ width:100%; }
  .btn[disabled]{ opacity:.45; pointer-events:none; box-shadow:none; }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:16px; }

  /* mapa */
  .mapbox{ position:relative; width:100%; aspect-ratio:1/1; max-width:100%; border-radius:var(--r-lg); overflow:hidden;
    border:1px solid var(--border); background:var(--surface-2); box-shadow:var(--shadow); }
  #map{ position:absolute; inset:0; }
  .mapmsg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px; color:var(--ink-soft); font-size:14px; pointer-events:none; }
  .leaflet-container{ font-family:var(--font); background:var(--surface-2); }
  .leaflet-bar{ border:none !important; box-shadow:var(--shadow-lift) !important; border-radius:10px !important; overflow:hidden; }
  .leaflet-bar a{ width:34px !important; height:34px !important; line-height:34px !important; color:#17212F !important; border-color:#E2E8F0 !important; }
  .leaflet-control-layers{ border:none !important; border-radius:10px !important; box-shadow:var(--shadow-lift) !important; }
  .leaflet-control-attribution{ font-size:10px !important; border-top-left-radius:6px; }
  .gpsline{ align-self:center; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; font-weight:500; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:6px 12px; min-height:30px; text-align:center; max-width:100%; }
  .gpsline::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .gpsline.ok{ color:var(--ink); } .gpsline.ok::before{ background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .gpsline.warn{ color:var(--warn); } .gpsline.warn::before{ background:var(--warn); }
  .gpsline.err{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 30%, var(--border)); } .gpsline.err::before{ background:var(--danger); }

  /* formulário */
  .fields{ display:grid; grid-template-columns:1fr 1fr; gap:14px 12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); box-shadow:var(--shadow); padding:16px; }
  @media (max-width:360px){ .fields{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:16px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:7px; letter-spacing:.005em; }
  .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
  .field input{ font-family:var(--font); font-size:16px; padding:0 12px; height:48px; border-radius:12px; border:1px solid var(--border);
    background:var(--field); color:var(--ink); width:100%; min-width:0; transition:border-color .12s, background-color .12s; }
  .field input::placeholder{ color:var(--ink-faint); }
  .field input:focus{ border-color:var(--focus); background:var(--surface); outline:none; box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }

  /* contagem: painel do cronómetro */
  .hud{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-lg); box-shadow:var(--shadow); padding:12px 12px 12px 16px; }
  .hud-main{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .clockline{ display:flex; align-items:center; gap:10px; }
  .clock{ font-size:34px; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .status{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 9px; border-radius:99px;
    background:color-mix(in srgb, var(--ok) 12%, var(--surface)); color:var(--ok); white-space:nowrap; }
  .status::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s ease-in-out infinite; }
  .status.paused{ background:color-mix(in srgb, var(--warn) 14%, var(--surface)); color:var(--warn); }
  .status.paused::before{ animation:none; }
  @keyframes pulse{ 50%{ opacity:.35; } }
  .meta{ display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12.5px; color:var(--ink-soft); }
  .meta span{ display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  .meta svg{ width:14px; height:14px; color:var(--ink-faint); }
  .pausebtn{ flex:none; width:56px; height:56px; min-height:0; padding:0; border-radius:16px; flex-direction:column; gap:2px; font-size:11px; font-weight:600; }
  .pausebtn svg{ width:20px; height:20px; }
  .pausebtn.on{ background:var(--primary); color:var(--primary-ink); border-color:transparent; }

  /* cabeçalhos de sentido */
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dirhead{ display:flex; align-items:center; gap:10px; border-radius:var(--r); padding:9px 12px; color:var(--on-dir); min-width:0; box-shadow:var(--shadow); }
  .dirhead.d1{ background:var(--s1-bg); } .dirhead.d2{ background:var(--s2-bg); }
  .dirhead .ar{ width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.18); display:grid; place-items:center; flex:none; }
  .dirhead .ar svg{ width:18px; height:18px; }
  .dirhead .tx{ display:flex; flex-direction:column; min-width:0; }
  .dirhead b{ font-size:15px; font-weight:700; letter-spacing:.01em; line-height:1.15; }
  .dirhead small{ font-size:11.5px; font-weight:500; opacity:.88; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* grelha de contagem: uma linha por classe, Chegada e Partida lado a lado */
  .grid{ display:flex; flex-direction:column; gap:10px; flex:1; }
  .crow{ display:flex; flex-direction:column; gap:5px; flex:1; }
  .crow .cname{ font-size:12.5px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:7px; padding-left:2px; letter-spacing:.005em; }
  .crow .cname i{ width:8px; height:8px; border-radius:50%; flex:none; }
  .vbtn{ position:relative; overflow:hidden; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--r);
    padding:8px 14px 8px 8px; cursor:pointer; font-family:var(--font); display:flex; align-items:center; justify-content:space-between; gap:10px;
    min-height:60px; flex:1; box-shadow:var(--shadow); transition:background-color .18s ease, border-color .18s ease;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .vbtn:active{ transform:scale(.985); }
  .chip{ --chip:var(--surface-2); background:var(--chip); color:var(--icon);
    width:54px; height:42px; border-radius:11px; display:grid; place-items:center; flex:none; transition:background-color .18s ease; }
  .chip svg{ width:42px; height:26px; display:block; }
  .vbtn .cnt{ font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1; }
  .vbtn.flash{ transition:none; }
  .vbtn.flash.d1{ background:color-mix(in srgb, var(--s1) 12%, var(--surface)); border-color:color-mix(in srgb, var(--s1) 45%, var(--border)); }
  .vbtn.flash.d2{ background:color-mix(in srgb, var(--s2) 12%, var(--surface)); border-color:color-mix(in srgb, var(--s2) 45%, var(--border)); }
  .vbtn.flash .chip{ --chip:var(--surface); }
  .vbtn.paused{ opacity:.4; pointer-events:none; box-shadow:none; }
  .vbtn .hold{ position:absolute; left:0; bottom:0; height:3px; width:0; background:var(--danger); border-radius:0 3px 3px 0; }
  .vbtn .holdtxt{ position:absolute; left:0; right:0; bottom:5px; text-align:center; font-size:10.5px; font-weight:600; color:var(--danger); opacity:0; pointer-events:none; }
  .vbtn.holding{ border-color:color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .vbtn.holding .holdtxt{ opacity:1; }
  .crow.grp .cols{ gap:10px; }
  .trio{ gap:4px; }
  @media (max-height:760px){ .vbtn:not(.mini){ min-height:52px; } .chip{ height:36px; } .grid{ gap:7px; } }
  .trio{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; min-width:0; }
  .gcell{ display:grid; min-width:0; }
  .gcell > *{ grid-area:1/1; }
  .gcell .trio{ visibility:hidden; opacity:0; transform:scale(.97); transition:opacity .12s ease, transform .12s ease; }
  .gcell.open .trio{ visibility:visible; opacity:1; transform:none; }
  .gcell.open .gmain{ visibility:hidden; }
  .gmain .more{ width:18px; height:18px; color:var(--ink-faint); margin-left:auto; margin-right:-4px; display:grid; place-items:center; }
  .gmain .more svg{ width:18px; height:18px; }
  .vbtn.mini{ flex-direction:column; justify-content:center; align-items:center; gap:2px; padding:6px 1px; min-height:58px; min-width:0; }
  .vbtn.mini .sub{ font-size:10.5px; font-weight:600; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:clip; max-width:100%; letter-spacing:-.01em; }
  .vbtn.mini .cnt{ font-size:24px; }
  .vbtn.mini .fix{ flex-direction:column; gap:4px; padding:4px; }
  .vbtn.mini .fix span{ font-size:13px; }
  .vbtn .fix{ position:absolute; inset:0; display:flex; gap:6px; padding:6px; background:var(--surface); }
  .vbtn .fix span{ flex:1; display:flex; align-items:center; justify-content:center; border-radius:10px; font-size:15px; font-weight:700; }
  .vbtn .fix .minus{ background:var(--danger); color:#fff; }
  .vbtn .fix .cancel{ background:var(--surface-2); color:var(--ink); }


  /* faixas de fundo por sentido (Chegada | Partida), ligadas ao cabeçalho */
  .board{ display:flex; flex-direction:column; flex:1; }
  .board > .cols{ gap:10px; }
  .board > .cols .dirhead{ border-radius:var(--r) var(--r) 0 0; box-shadow:none; }
  .board .grid{ position:relative; padding:8px 6px 10px; }
  .board .grid .cols, .board .crow.grp .cols{ gap:22px; }
  .board .crow{ position:relative; z-index:1; }
  .lane{ position:absolute; top:0; bottom:0; width:calc(50% - 5px); border-radius:0 0 var(--r) var(--r); z-index:0; pointer-events:none; }
  .lane.l1{ left:0; background:color-mix(in srgb, var(--s1-bg) 11%, var(--bg)); border:1px solid color-mix(in srgb, var(--s1-bg) 20%, var(--bg)); border-top:0; }
  .lane.l2{ right:0; background:color-mix(in srgb, var(--s2-bg) 11%, var(--bg)); border:1px solid color-mix(in srgb, var(--s2-bg) 20%, var(--bg)); border-top:0; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lane.l1{ background:color-mix(in srgb, var(--s1-bg) 17%, var(--bg)); } :root:not([data-theme="light"]) .lane.l2{ background:color-mix(in srgb, var(--s2-bg) 17%, var(--bg)); } }
  :root[data-theme="dark"] .lane.l1{ background:color-mix(in srgb, var(--s1-bg) 17%, var(--bg)); } :root[data-theme="dark"] .lane.l2{ background:color-mix(in srgb, var(--s2-bg) 17%, var(--bg)); }
  .board .crow .cname{ padding-left:4px; }

  /* totais e ações */
  .total{ display:grid; grid-template-columns:1fr 1fr 1.25fr; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    box-shadow:var(--shadow); overflow:hidden; }
  .total > div{ padding:10px 12px; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .total > div + div{ border-left:1px solid var(--border); }
  .total .k{ font-size:11.5px; font-weight:600; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }
  .total .v{ font-size:20px; font-weight:700; letter-spacing:-.01em; line-height:1.1; }
  .total .grand{ background:var(--surface-2); }
  .total .grand .v{ font-size:26px; }
  .tools{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .hint{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; color:var(--ink-faint); text-align:center; }
  .hint svg{ width:14px; height:14px; }

  /* lista e resumo */
  .section-label{ font-size:12px; font-weight:600; color:var(--ink-soft); letter-spacing:.04em; text-transform:uppercase; margin:6px 2px -2px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:14px 16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); }
  .card{ position:relative; }
  .card.closed{ padding-block:12px; }
  .cardtoggle{ position:absolute; inset:0; background:transparent; border:none; cursor:pointer; border-radius:var(--r-lg); -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .card.open .cardtoggle{ bottom:auto; height:52px; }
  .cardtoggle:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .card.open{ border-color:var(--border-strong); box-shadow:var(--shadow-lift); }
  .card .t{ font-weight:700; font-size:15.5px; letter-spacing:-.01em; }
  .card .s{ font-size:13px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:4px 12px; }
  .card .s span{ display:inline-flex; align-items:center; gap:5px; }
  .card .s svg{ width:14px; height:14px; color:var(--ink-faint); }
  .stats{ display:flex; gap:16px; }
  .stats div{ display:flex; flex-direction:column; }
  .stats b{ font-size:18px; font-weight:700; line-height:1.1; }
  .stats small{ font-size:11.5px; color:var(--ink-soft); }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row .push{ margin-left:auto; }
  .listhead{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 2px -2px; }
  .listhead .section-label{ margin:0; }
  .selbtn{ min-height:32px; padding:4px 10px; font-size:13px; font-weight:600; color:var(--primary); }
  .card.selectable .cardhead{ justify-content:flex-start !important; gap:10px; flex-wrap:nowrap; }
  .card.selectable .cardhead .t{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14.5px; }
  .card.selectable .cardhead .pill{ margin-left:auto; }
  .tick{ width:22px; height:22px; border-radius:7px; border:2px solid var(--border-strong); display:grid; place-items:center; flex:none; color:#fff; }
  .tick svg{ width:15px; height:15px; }
  .card.picked{ border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset; }
  .card.picked .tick{ background:var(--danger); border-color:var(--danger); }

// Ligeiros/Pesados: botão inteiro que, ao toque, abre os 3 subtipos; fecha após contar ou 5 s sem uso
function groupCell(s, L, d, t, onChange){
  var dirTxt=(d===1?'chegada':'partida'), tm=null;
  function sum(){ return s.log.reduce(function(a,e){ return a+(e.dir===d && L.ids.indexOf(normCat(e.cat))>=0 ? 1 : 0); },0); }
  var cnt=el('div',{class:'cnt num'},[String(sum())]);
  var main=el('div',{role:'button', tabindex:'0', class:'vbtn gmain d'+d+(s.paused?' paused':''), 'aria-label':L.nome+', '+dirTxt, 'aria-expanded':'false'},
    [el('span',{class:'chip', html:ICONS[L.icon]}), el('span',{class:'more', html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'}), cnt]);
  function changed(){ cnt.textContent=String(sum()); onChange(); }
  function close(){ clearTimeout(tm); tm=null; cell.classList.remove('open'); main.setAttribute('aria-expanded','false'); }
  function arm(ms){ clearTimeout(tm); tm=setTimeout(function(){ if(trio.querySelector('.fix') || trio.querySelector('.holding')){ arm(1500); return; } close(); }, ms); }
  function open(){ if(s.paused) return; cell.classList.add('open'); main.setAttribute('aria-expanded','true'); arm(5000); if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(e){} } }
  var trio=el('div',{class:'trio'}, L.ids.map(function(id){ return countButton(s, CAT_BY_ID[id], d, t[id][d], changed, true, function(){ arm(350); }); }));
  trio.addEventListener('pointerdown', function(){ arm(5000); });
  main.addEventListener('click', open);
  main.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(); } });
  main.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  var cell=el('div',{class:'gcell'},[main, trio]);
  return cell;
}

// descrição do sentido; ignora valores antigos iguais ao próprio rótulo («Chegada»/«Partida»)
function dirTxt(s,d){ var v=((d===1?s.dir1:s.dir2)||'').trim(); return /^(chegada|partida|sa[ií]da)$/i.test(v) ? '' : v; }
function dirLbl(s,d){ return dirTxt(s,d) || ('Sentido '+d); }

function countButton(s, c, d, n, onChange, mini, onCounted){
  var cnt=el('div',{class:'cnt num'},[String(n)]);
  var bar=el('div',{class:'hold'}), txt=el('div',{class:'holdtxt'},['Mantenha para corrigir…']);
  var b=el('div',{role:'button', tabindex:'0', class:'vbtn d'+d+(mini?' mini':'')+(s.paused?' paused':''), 'aria-label':c.full+', '+(d===1?'chegada':'partida')},
    mini ? [el('span',{class:'sub'},[c.short]), cnt, bar] : [el('span',{class:'chip', html:ICONS[c.id], style:'--cat:'+c.color}), cnt, bar, txt]);
  var timer=null, shown=null, t0=0, raf=null, fixOpen=false, moved=false;
  function count(){ return s.log.reduce(function(a,e){ return a+(normCat(e.cat)===c.id && e.dir===d ? 1 : 0); },0); }
  function refresh(){ cnt.textContent=String(count()); onChange(); }
  function stopHold(){ clearTimeout(timer); clearTimeout(shown); cancelAnimationFrame(raf); timer=null; b.classList.remove('holding'); bar.style.width='0'; }
  function anim(){ var p=Math.min(1,(Date.now()-t0)/HOLD_MS); bar.style.width=(p*100)+'%'; if(p<1) raf=requestAnimationFrame(anim); }
  function openFix(){
    stopHold(); fixOpen=true; if(navigator.vibrate){ try{ navigator.vibrate([30,60,30]); }catch(e){} }
    var minus=el('span',{class:'minus'},['−1']), cancel=el('span',{class:'cancel'},[mini?'✕':'Cancelar']);
    var box=el('div',{class:'fix'},[minus, cancel]); b.appendChild(box);
    function close(){ box.remove(); setTimeout(function(){ fixOpen=false; }, 50); }
    minus.addEventListener('click', function(e){ e.stopPropagation();
      for(var i=s.log.length-1;i>=0;i--){ if(normCat(s.log[i].cat)===c.id && s.log[i].dir===d){ s.log.splice(i,1); save(); refresh(); toast('Retirado 1 · '+c.full+' · '+(d===1?'chegada':'partida')); close(); return; } }
      toast('Não há registos para retirar'); close(); });
    cancel.addEventListener('click', function(e){ e.stopPropagation(); close(); });
  }
  b.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  b.addEventListener('pointerdown', function(e){
    if(s.paused || fixOpen) return;
    moved=false; t0=Date.now();
    shown=setTimeout(function(){ b.classList.add('holding'); raf=requestAnimationFrame(anim); }, 500);
    timer=setTimeout(openFix, HOLD_MS);
  });
  ['pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev, function(){ if(timer){ moved=true; stopHold(); } }); });
  b.addEventListener('pointerup', function(){
    if(fixOpen || s.paused) return;
    var held = timer ? Date.now()-t0 : HOLD_MS;
    var wasTimer = !!timer; stopHold();
    if(!wasTimer || moved) return;
    if(held < 1500){
      s.log.push({t:Date.now(), dir:d, cat:c.id}); save(); refresh();
      b.classList.add('flash'); setTimeout(function(){ b.classList.remove('flash'); }, 140);
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(e){} }
      if(onCounted) onCounted();
    }
  });
  b.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); if(s.paused) return; s.log.push({t:Date.now(), dir:d, cat:c.id}); save(); refresh(); if(onCounted) onCounted(); } });
  return b;
}

// link de configuração: …/trafficount/#ligar=<base64 de {"url":…,"codigo":…}> liga o telemóvel à folha e limpa o endereço
function applyLink(){
  var m=/^#ligar=([A-Za-z0-9+\/=_-]+)$/.exec(location.hash||'');
  if(!m) return false;
  try{
    var j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));
    if(/^https:\/\/script\.google\.com\//.test(j.url) && j.codigo){ pref('cloud', {url:j.url, codigo:j.codigo}); setTimeout(function(){ toast('Dispositivo ligado ao servidor da equipa'); }, 300); view = view==='count' ? 'count' : 'list'; }
  }catch(e){}
  try{ history.replaceState(null, '', location.pathname); }catch(e){ location.hash=''; }
  return true;
}
applyLink();
window.addEventListener('hashchange', function(){ if(applyLink()){ render(); syncNow(false); } });
render();
setTimeout(function(){ syncNow(false); }, 1500);
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(r){ try{ r.update(); }catch(e){} }).catch(function(){});
  // nova versão instalada: recarrega para a mostrar (nunca a meio de uma contagem)
  var hadCtrl=!!navigator.serviceWorker.controller, reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!hadCtrl || reloaded) return;
    var counting = DB.activeId && DB.sessions[DB.activeId] && !DB.sessions[DB.activeId].endedAt;
    if(!counting){ reloaded=true; location.reload(); }
  });
}
})();
</script>
